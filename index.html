<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>GTA V Map - Live Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0fa8d2;
      font-family: sans-serif;
    }
    .emoji-marker-icon {
      font-size: 32px;
      line-height: 1;
      text-align: center;
      cursor: grab;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }
    .custom-img-icon {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      cursor: grab;
      user-select: none;
      object-fit: contain;
    }
    .emoji-marker-icon:active, .custom-img-icon:active {
      cursor: grabbing;
    }
    .controls {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.95);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-picker {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 8px;
      border-radius: 6px;
      align-items: center;
    }
    .icon-choice {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.15s ease;
      background: rgba(0, 0, 0, 0.35);
      user-select: none;
      flex-shrink: 0;
    }
    .icon-choice span {
      font-size: 26px;
      line-height: 1;
    }
    .icon-choice img {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
    .icon-choice:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .icon-choice.selected {
      border-color: #ff7b00;
      background: rgba(255, 123, 0, 0.35);
      transform: scale(1.08);
    }
    button.btn-add {
      background: #ff7b00;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button.btn-add:hover {
      background: #e06d00;
    }
    .hint {
      font-size: 11px;
      color: #bbb;
    }
    .btn-delete {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      margin-top: 5px;
    }
    .btn-delete:hover {
      background: #c1121f;
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="top-row">
      <div class="icon-picker" id="iconPicker"></div>
      <button class="btn-add" id="addMarkerBtn">Adaugă pe hartă</button>
    </div>
    <div class="hint">Selectează categoria, apasă butonul sau dă click pe marker pentru opțiuni.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      push, 
      set, 
      update, 
      remove, 
      onChildAdded, 
      onChildChanged, 
      onChildRemoved 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const MARKER_TYPES = [
      { id: 'dovleac',     name: 'Dovleac',     type: 'emoji', value: '🎃' },
      { id: 'banca',       name: 'Bancă',       type: 'image', file: 'icons/banca.png' },
      { id: 'garaj',       name: 'Garaj',       type: 'image', file: 'icons/garaj.png' },
      { id: 'shop',        name: 'Shop',        type: 'image', file: 'icons/shop.png' },
      { id: 'benzinarie',  name: 'Benzinărie',  type: 'image', file: 'icons/benzinarie.png' }
    ];

    let currentSelectedId = MARKER_TYPES[0].id;

    const pickerContainer = document.getElementById('iconPicker');
    MARKER_TYPES.forEach((item, index) => {
      const btn = document.createElement('div');
      btn.className = `icon-choice ${index === 0 ? 'selected' : ''}`;
      btn.title = item.name;
      btn.dataset.id = item.id;

      if (item.type === 'emoji') {
        btn.innerHTML = `<span>${item.value}</span>`;
      } else {
        btn.innerHTML = `<img src="${item.file}" alt="${item.name}">`;
      }

      btn.addEventListener('click', () => {
        document.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
        btn.classList.add('selected');
        currentSelectedId = item.id;
      });

      pickerContainer.appendChild(btn);
    });

    function getLeafletIcon(iconId) {
      const config = MARKER_TYPES.find(i => i.id === iconId) || MARKER_TYPES[0];

      if (config.type === 'emoji') {
        return L.divIcon({
          className: 'emoji-marker-icon',
          html: config.value,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16]
        });
      } else {
        return L.icon({
          iconUrl: config.file,
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -16],
          className: 'custom-img-icon'
        });
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDLGnIOfAS2VXz_ao8fE12g1vItJY0NP5g",
      authDomain: "gta-pumpkins.firebaseapp.com",
      databaseURL: "https://gta-pumpkins-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "gta-pumpkins",
      storageBucket: "gta-pumpkins.firebasestorage.app",
      messagingSenderId: "217343404369",
      appId: "1:217343404369:web:57062f30997247f4768b70"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const markersDbRef = ref(db, 'markers');
    const oldPumpkinsRef = ref(db, 'pumpkins');

    const mapWidth = 5000;
    const mapHeight = 5000;
    const bounds = [[0, 0], [mapHeight, mapWidth]];

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -4,
      maxZoom: 2,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    });

    L.imageOverlay('gta_map.png', bounds).addTo(map);
    map.fitBounds(bounds);

    const localMarkers = {};

    document.getElementById('addMarkerBtn').addEventListener('click', () => {
      const center = map.getCenter();
      const newRef = push(markersDbRef);
      set(newRef, {
        x: Math.round(center.lng),
        y: Math.round(center.lat),
        iconType: currentSelectedId
      });
    });

    function setupMarkerSync(dbReference, pathName, defaultType = 'dovleac') {
      onChildAdded(dbReference, (snapshot) => {
        const id = snapshot.key;
        const data = snapshot.val();
        const iconType = data.iconType || defaultType;
        const typeInfo = MARKER_TYPES.find(i => i.id === iconType) || MARKER_TYPES[0];

        const marker = L.marker([data.y, data.x], {
          icon: getLeafletIcon(iconType),
          draggable: true
        }).addTo(map);

        const popupHtml = `
          <div style="text-align: center;">
            <p style="margin: 0 0 6px 0; font-weight: bold; font-size: 13px;">${typeInfo.name}</p>
            <button class="btn-delete" id="del-${id}">Șterge</button>
          </div>
        `;
        marker.bindPopup(popupHtml);

        marker.on('popupopen', () => {
          const btn = document.getElementById(`del-${id}`);
          if (btn) {
            btn.onclick = () => {
              if (confirm(`Sigur vrei să ștergi acest marker (${typeInfo.name})?`)) {
                remove(ref(db, `${pathName}/${id}`));
              }
            };
          }
        });

        marker.on('contextmenu', () => {
          if (confirm(`Sigur vrei să ștergi acest marker (${typeInfo.name})?`)) {
            remove(ref(db, `${pathName}/${id}`));
          }
        });

        marker.on('dragend', () => {
          const pos = marker.getLatLng();
          update(ref(db, `${pathName}/${id}`), {
            x: Math.round(pos.lng),
            y: Math.round(pos.lat)
          });
        });

        localMarkers[id] = marker;
      });

      onChildChanged(dbReference, (snapshot) => {
        const id = snapshot.key;
        const data = snapshot.val();
        const marker = localMarkers[id];

        if (marker) {
          const currentPos = marker.getLatLng();
          if (currentPos.lat !== data.y || currentPos.lng !== data.x) {
            marker.setLatLng([data.y, data.x]);
          }
          if (data.iconType) {
            marker.setIcon(getLeafletIcon(data.iconType));
          }
        }
      });

      onChildRemoved(dbReference, (snapshot) => {
        const id = snapshot.key;
        if (localMarkers[id]) {
          map.removeLayer(localMarkers[id]);
          delete localMarkers[id];
        }
      });
    }

    setupMarkerSync(markersDbRef, 'markers');
    setupMarkerSync(oldPumpkinsRef, 'pumpkins', 'dovleac');
  </script>
</body>
</html>
