<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>GTA V Map - Live Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0fa8d2;
      font-family: sans-serif;
    }
    .emoji-marker-icon {
      font-size: 30px;
      line-height: 1;
      text-align: center;
      cursor: grab;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }
    .emoji-marker-icon:active, .custom-img-icon:active {
      cursor: grabbing;
    }
    .custom-img-icon {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      cursor: grab;
      user-select: none;
    }
    .controls {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.92);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-picker {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 6px;
      border-radius: 6px;
      align-items: center;
    }
    .icon-choice {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.15s ease;
      background: rgba(0, 0, 0, 0.25);
      font-size: 22px;
      user-select: none;
    }
    .icon-choice img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      pointer-events: none;
    }
    .icon-choice:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .icon-choice.selected {
      border-color: #ff7b00;
      background: rgba(255, 123, 0, 0.3);
      transform: scale(1.08);
    }
    button.btn-add {
      background: #ff7b00;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button.btn-add:hover {
      background: #e06d00;
    }
    .hint {
      font-size: 11px;
      color: #bbb;
    }
    .btn-delete {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      margin-top: 5px;
    }
    .btn-delete:hover {
      background: #c1121f;
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="top-row">
      <div class="icon-picker" id="iconPicker"></div>
      <button class="btn-add" id="addMarkerBtn">Adaugă pe hartă</button>
    </div>
    <div class="hint">Selectează categoria, apasă butonul sau dă click pe marker pentru ștergere.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
